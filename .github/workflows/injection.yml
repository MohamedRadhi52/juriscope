name: injection

# Mesure les attaques par injection de prompt réussies, sans puis avec garde-fous, et
# commite les résultats.
on:
  push:
    branches: [main]
    paths:
      - src/juriscope/generate/guard.py
      - src/juriscope/eval/injection.py
      - data/questions/injections.jsonl
      - .github/workflows/injection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  injection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: npm-${{ hashFiles('data/sources.json') }}
      - run: make data
      - name: Attaques sans puis avec garde-fous
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .venv/bin/python -m juriscope.eval.injection 2>&1 | tee injection.log
      # la dernière ligne du journal devient une annotation, lisible sans être connecté
      - name: Erreur en annotation
        if: failure() || cancelled()
        run: echo "::error title=Injection::$(tail -n 1 injection.log)"
      - name: Commit des résultats
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/garde-fous
          git diff --cached --quiet || git commit -m "Garde-fous : attaques par injection mesurées avant et après"
          git pull --rebase
          git push

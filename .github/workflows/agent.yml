name: agent

# Évalue l'agent LangGraph et le RAG simple sur les mêmes scénarios, puis commite les résultats.
on:
  push:
    branches: [main]
    paths:
      - src/juriscope/agent/**
      - data/questions/agent.jsonl
      - .github/workflows/agent.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: npm-${{ hashFiles('data/sources.json') }}
      - run: make data
      - run: .venv/bin/pip install --quiet -r requirements-embed.txt
      - name: Vecteurs et modèle affinés
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download embeddings -p ft-passages.npz -p e5-small-ft.zip --dir data/index --clobber
          mkdir -p data/models && unzip -q data/index/e5-small-ft.zip -d data/models
      - name: Agent et RAG simple sur les scénarios
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .venv/bin/python -m juriscope.agent.evaluate 2>&1 | tee agent.log
      # la dernière ligne du journal devient une annotation, lisible sans être connecté
      - name: Erreur en annotation
        if: failure() || cancelled()
        run: echo "::error title=Agent::$(tail -n 1 agent.log)"
      - name: Commit des résultats
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/agent
          git diff --cached --quiet || git commit -m "Agent : évaluation sur 30 scénarios face au RAG simple"
          git pull --rebase
          git push
